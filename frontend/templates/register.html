<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureChat - Register</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>SecureChat</h1>
        <div class="auth-form">
            <h2>Register</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>
                <button type="submit">Register</button>
            </form>
            <p>Already have an account? <a href="/login.html">Login</a></p>
            <div id="error-message" class="error"></div>
            <div id="success-message" class="success"></div>
        </div>
    </div>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                document.getElementById('error-message').innerText = 'Passwords do not match';
                return;
            }

            document.getElementById('error-message').innerText = '';
            document.getElementById('success-message').innerText = 'Generating keys and registering...';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('success-message').innerHTML = `Registration successful!<br>Key Fingerprint: <code>${data.fingerprint}</code><br><a href="/login.html">Proceed to Login</a>`;
                } else {
                    document.getElementById('error-message').innerText = data.error || 'Registration failed';
                    document.getElementById('success-message').innerText = '';
                }
            } catch (err) {
                document.getElementById('error-message').innerText = 'Network error';
                document.getElementById('success-message').innerText = '';
            }
        });
    </script>
</body>
</html>
